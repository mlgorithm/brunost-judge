name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check src tests
      - run: python -m compileall -q src tests
      - run: python -m brunost_judge task validate examples/ioai-cpu
      - run: bash -n scripts/*.sh
      - run: BRUNOST_JUDGE_SANDBOX_IMAGE='example@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
