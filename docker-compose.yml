services:
  judge-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brunost_judge}
      POSTGRES_USER: ${POSTGRES_USER:-brunost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brunost} -d ${POSTGRES_DB:-brunost_judge}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - judge-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # API and worker containers run read-only as an unprivileged user. Initialize
  # the shared artifact volume once so both can safely create immutable bundles.
  artifact-init:
    build: .
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /artifacts && chown -R 10001:10001 /artifacts"]
    user: "0:0"
    volumes:
      - judge-artifacts:/artifacts
    restart: "no"

  judge-api:
    build: .
    command: ["server", "--host", "0.0.0.0", "--port", "8787"]
    environment:
      BRUNOST_JUDGE_DATABASE_URL: postgresql://${POSTGRES_USER:-brunost}:${POSTGRES_PASSWORD:-local-development-only}@judge-postgres:5432/${POSTGRES_DB:-brunost_judge}
      BRUNOST_JUDGE_API_TOKEN: ${BRUNOST_JUDGE_API_TOKEN:-change-me-before-exposure}
      BRUNOST_JUDGE_REQUIRE_API_TOKEN: "true"
      BRUNOST_JUDGE_REQUIRE_WORKER_TOKEN: "true"
      BRUNOST_JUDGE_CLUSTER_ID: ${BRUNOST_JUDGE_CLUSTER_ID:-local}
      BRUNOST_JUDGE_CALLBACK_SIGNING_SECRET: ${BRUNOST_JUDGE_CALLBACK_SIGNING_SECRET:-change-me-before-exposure}
      BRUNOST_JUDGE_REQUIRE_SIGNED_CALLBACKS: "true"
      BRUNOST_JUDGE_ARTIFACT_ROOT: /artifacts
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/readyz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ./examples:/tasks:ro
      - ./local-submissions:/submissions
      - judge-artifacts:/artifacts
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      judge-postgres:
        condition: service_healthy
      artifact-init:
        condition: service_completed_successfully
    restart: unless-stopped

  callback-dispatcher:
    build: .
    command: ["callback-dispatcher", "--poll-seconds", "1"]
    # The shared image healthcheck targets the API; this service has no HTTP
    # listener and should be supervised by its process/restart policy.
    healthcheck:
      disable: true
    environment:
      BRUNOST_JUDGE_DATABASE_URL: postgresql://${POSTGRES_USER:-brunost}:${POSTGRES_PASSWORD:-local-development-only}@judge-postgres:5432/${POSTGRES_DB:-brunost_judge}
      BRUNOST_JUDGE_CALLBACK_SIGNING_SECRET: ${BRUNOST_JUDGE_CALLBACK_SIGNING_SECRET:-change-me-before-exposure}
      BRUNOST_JUDGE_REQUIRE_SIGNED_CALLBACKS: "true"
      BRUNOST_JUDGE_ENV: ${BRUNOST_JUDGE_ENV:-development}
    depends_on:
      judge-api:
        condition: service_healthy
    restart: unless-stopped

  judge-worker:
    build: .
    command: ["worker", "--poll-seconds", "1", "--queue", "default", "--resource-class", "cpu"]
    # The image healthcheck probes the API's /readyz endpoint; a worker is not
    # an HTTP service, so inherit no HTTP healthcheck from the shared image.
    healthcheck:
      disable: true
    environment:
      BRUNOST_JUDGE_DATABASE_URL: postgresql://${POSTGRES_USER:-brunost}:${POSTGRES_PASSWORD:-local-development-only}@judge-postgres:5432/${POSTGRES_DB:-brunost_judge}
      BRUNOST_JUDGE_CALLBACK_SIGNING_SECRET: ${BRUNOST_JUDGE_CALLBACK_SIGNING_SECRET:-change-me-before-exposure}
      BRUNOST_JUDGE_REQUIRE_SIGNED_CALLBACKS: "true"
      BRUNOST_JUDGE_ARTIFACT_ROOT: /artifacts
    volumes:
      - ./examples:/tasks:ro
      - ./local-submissions:/submissions
      - judge-artifacts:/artifacts
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${BRUNOST_JUDGE_WORKER_TMPFS_SIZE:-256m}
    depends_on:
      judge-postgres:
        condition: service_healthy
      artifact-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  judge-postgres-data:
  judge-artifacts:
