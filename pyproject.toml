[project]
name = "brunost-judge"
version = "0.8.0"
description = "Open-source, platform-independent judging contracts and task tooling"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
brunost = "brunost_judge.cli:main"

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
production = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "psycopg[binary]>=3.2,<4", "boto3>=1.35,<2"]
dev = ["pytest>=8", "numpy>=1.26", "ruff>=0.6", "fastapi>=0.115,<1", "httpx>=0.27,<1"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
